<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-container">
        <h1>My To-Do List</h1>
        <p class="intro">Write your tasks and stay organized.</p>

        <form id="todo-form">
            <div class="form-group">
                <label for="todo-title">Task Name</label>
                <input type="text" id="todo-title" name="title" placeholder="enter task name" required>
            </div>

            <div class="form-group">
                <label for="todo-dsep">Details</label>
                <textarea id="todo-description" name="description" rows="3" placeholder="Add more details here" required></textarea>
            </div>

            <div class="form-group">
                <label for="todo-date">When is it due?</label>
                <input type="date" id="todo-date" name="date" required>
            </div>

            <div class="form-group">
                <label for="todo-priority">Important Level</label>
                <select id="todo-priority" name="priority" required>
                    <option value="">Choose</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>

            <button type="submit">Add</button>
        </form>

        <section class="todo-list-section">
            <h2>My Tasks</h2>
            <ul id="todo-list">
                <li class="empty-message">No tasks yet. Add your first task.</li>
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
